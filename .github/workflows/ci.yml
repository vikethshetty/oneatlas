name: OneAtlas checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneatlas?schema=public
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-for-build-only
      ADMIN_SESSION_SECRET: ci-session-secret-for-build-only-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
